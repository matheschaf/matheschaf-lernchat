# ---------------------------------------------------------------------------
# Deploy: Bei jedem Push auf "main" gehen die geänderten Dateien per FTP
# auf den Server. Nur Änderungen – nichts wird gelöscht.
#
# Einmalig auf GitHub hinterlegen (Settings → Secrets and variables → Actions):
#   FTP_SERVER      z. B. ftp.matheschaf.de
#   FTP_USERNAME    FTP-Benutzer
#   FTP_PASSWORD    FTP-Passwort
#   FTP_SERVER_DIR  Zielordner, MUSS mit / enden, z. B. /lernchat/
#
# Wenn dein Hoster FTPS (verschlüsselt) verlangt, bei "protocol" und
# "security" die Kommentare entfernen.
# ---------------------------------------------------------------------------

name: Deploy (FTP)

on:
  push:
    branches: [main]
  workflow_dispatch:          # zusätzlich per Klick startbar

jobs:
  hochladen:
    runs-on: ubuntu-latest
    steps:
      - name: Dateien aus dem Repository holen
        uses: actions/checkout@v4

      - name: Nur geänderte Dateien hochladen
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          # protocol: ftps
          # security: strict
          state-name: .ftp-deploy-sync-state.json
          exclude: |
            **/.git*
            **/.git*/**
            **/.vscode/**
            **/.github/**
            **/node_modules/**
            **/*.md
